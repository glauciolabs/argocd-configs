# Mapeamento de Segredos: GitHub Secrets -> SealedSecrets no Kubernetes
# Cada entrada diz a Action qual secret ler do GitHub, qual nome dar ao K8s Secret,
# e em qual namespace ele deve ser criado.

secrets:
  - name: cloudflare-api-token
    ghSecret: PROD_CLOUDFLARE_TOKEN
    namespace: external-dns
  - name: cloudflare-api-token
    ghSecret: PROD_CLOUDFLARE_TOKEN
    namespace: cert-manager
  - name: cloudflare-tunnel-credentials
    ghSecret: PROD_CLOUDFLARE_TUNNEL_CREDENTIALS
    namespace: cloudflare
  - name: docker-registry-token
    ghSecret: PROD_DOCKER_REGISTRY_TOKEN
    namespace: default

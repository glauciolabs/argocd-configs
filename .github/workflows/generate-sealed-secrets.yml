name: "🔐 Generate SealedSecrets"

on:
  workflow_dispatch: # Permite execução manual
  push:
    paths:
      - 'secret-mapping.yaml'
      - '.github/workflows/generate-sealed-secrets.yml'

permissions:
  contents: write # Permissão para commitar no repositório

jobs:
  seal-secrets:
    runs-on: ubuntu-latest
    env:
      SEALED_PUB_CERT: .sops/sealed-pub.pem
      # Mapeamento explícito de secrets do GitHub como variáveis de ambiente para a Action
      PROD_CLOUDFLARE_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TOKEN }}
      PROD_CLOUDFLARE_TUNNEL_CREDENTIALS: ${{ secrets.PROD_CLOUDFLARE_TUNNEL_CREDENTIALS }}
      PROD_DOCKER_REGISTRY_TOKEN: ${{ secrets.PROD_DOCKER_REGISTRY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.27.1"
          curl -L -o kubeseal https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64
          chmod +x kubeseal
          sudo mv kubeseal /usr/local/bin/

      - name: Generate Sealed Secrets
        shell: python
        run: |
          import os
          import yaml
          import subprocess

          # 1. Carrega o arquivo de mapeamento
          with open('secret-mapping.yaml', 'r') as f:
              mapping = yaml.safe_load(f)

          os.makedirs('sealed', exist_ok=True)

          # 2. Processa cada secret mapeado
          for item in mapping.get('secrets', []):
              name = item['name']
              gh_secret_name = item['ghSecret']
              namespace = item['namespace']

              # Obtém o valor do secret a partir das variáveis de ambiente
              secret_value = os.getenv(gh_secret_name)
              if not secret_value:
                  print(f"⚠️ Warning: GitHub secret {gh_secret_name} não está definido no ambiente. Pulando...")
                  continue

              print(f"🔐 Criptografando {name} para o namespace {namespace}...")

              # Cria o manifesto do Kubernetes Secret temporário em texto-plano
              # A stringData injeta o valor diretamente
              secret_manifest = {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": name,
                      "namespace": namespace
                  },
                  "type": "Opaque",
                  "stringData": {
                      "token": secret_value,
                      "credentials.json": secret_value  # Usado para o cloudflared
                  }
              }

              # Filtra campos não utilizados de acordo com o tipo de secret
              if name == "cloudflare-tunnel-credentials":
                  secret_manifest["stringData"].pop("token", None)
              else:
                  secret_manifest["stringData"].pop("credentials.json", None)

              tmp_file = f"/tmp/secret-{name}.yaml"
              with open(tmp_file, 'w') as tf:
                  yaml.dump(secret_manifest, tf)

              # Executa o kubeseal usando o certificado público salvo no repositório
              sealed_file = f"sealed/{name}-{namespace}.yaml"
              cmd = [
                  "kubeseal",
                  "--cert", os.getenv("SEALED_PUB_CERT"),
                  "--format", "yaml",
                  "--controller-name", "sealed-secrets-controller",
                  "--controller-namespace", "sealed-secrets"
              ]
              
              with open(tmp_file, 'r') as tf_in, open(sealed_file, 'w') as sf_out:
                  subprocess.run(cmd, stdin=tf_in, stdout=sf_out, check=True)

              print(f"✅ SealedSecret gerado com sucesso: {sealed_file}")

      - name: Commit and Push Sealed Secrets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sealed/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos SealedSecrets."
          else
            git commit -m "🔐 update: SealedSecrets atualizados automaticamente pela pipeline"
            git push
          fi

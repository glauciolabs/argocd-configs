apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Roda logo após a instalação do controller (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: "https://github.com/glauciolabs/argocd-configs.git"
    targetRevision: HEAD
    path: sealed
  destination:
    server: https://kubernetes.default.svc
    namespace: default # Os próprios manifests SealedSecret definem seu target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

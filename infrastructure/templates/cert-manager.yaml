apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    chart: cert-manager
    repoURL: "https://charts.jetstack.io"
    targetRevision: "v1.20.2"
    helm:
      values: |
        installCRDs: {{ .Values.certManager.installCRDs }}
        replicaCount: {{ .Values.certManager.replicaCount }}
        prometheus:
          enabled: {{ .Values.certManager.prometheus.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
